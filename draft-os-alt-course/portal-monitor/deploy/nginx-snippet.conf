# Include from update.cherryhaze.ru server block
location /portal-monitor/heartbeat {
    proxy_pass http://127.0.0.1:8099/heartbeat;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
}

location /portal-monitor/status {
    proxy_pass http://127.0.0.1:8099/status;
    proxy_read_timeout 15s;
}

location /portal-monitor/health {
    proxy_pass http://127.0.0.1:8099/health;
    proxy_read_timeout 10s;
}
