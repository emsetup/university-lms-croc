# HTTP practice.croc.ru → всегда HTTPS (иначе в адресной строке «Не защищено»)
server {
	listen 80;
	listen [::]:80;
	server_name practice.croc.ru;
	return 301 https://practice.croc.ru$request_uri;
}

# HTTP по IP и прочим именам (стенд без TLS на этом хосте)
server {
	listen 80;
	listen [::]:80;
	server_name 172.26.76.216 _;

	root /var/www/os-alt-lab/public;
	index index.php;
	charset utf-8;

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt  { access_log off; log_not_found off; }

	location ~ \.php$ {
		fastcgi_pass unix:/var/run/php8.2-fpm/php8.2-fpm.sock;
		fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
		include fastcgi_params;
		fastcgi_hide_header X-Powered-By;
		fastcgi_param HTTPS $https if_not_empty;
	}

	# ttyd per-lab (lab-daemon, порты 40000–41000) — только localhost; браузер через /ttyd/<port>/
	location ~ "^/ttyd/(?<tty_port>40[0-9]{3}|41000)(?:/(?<tty_path>.*))?$" {
		proxy_pass http://127.0.0.1:$tty_port/$tty_path$is_args$args;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 86400;
		proxy_buffering off;
	}

	location ^~ /console/ {
		proxy_pass http://127.0.0.1:7681/console/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 86400;
		proxy_buffering off;
	}

	access_log /var/log/nginx/os-alt-lab.access.log;
	error_log /var/log/nginx/os-alt-lab.error.log;
}

# HTTPS: practice.croc.ru (OIDC redirect_uri)
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name practice.croc.ru;

	ssl_certificate /etc/nginx/ssl-practice/practice.crt;
	ssl_certificate_key /etc/nginx/ssl-practice/practice.key;
	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL:10m;
	ssl_protocols TLSv1.2 TLSv1.3;

	add_header Strict-Transport-Security "max-age=15552000" always;
	# Автоматически поднимать http:// → https:// у подресурсов (scripts/iframes); снимает mixed content.
	add_header Content-Security-Policy "upgrade-insecure-requests" always;

	root /var/www/os-alt-lab/public;
	index index.php;
	charset utf-8;

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt  { access_log off; log_not_found off; }

	location ~ \.php$ {
		fastcgi_pass unix:/var/run/php8.2-fpm/php8.2-fpm.sock;
		fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
		include fastcgi_params;
		fastcgi_hide_header X-Powered-By;
		fastcgi_param HTTPS on;
	}

	# ttyd per-lab через TLS (иначе iframe http://IP:port → «broken HTTPS» / mixed content)
	location ~ "^/ttyd/(?<tty_port>40[0-9]{3}|41000)(?:/(?<tty_path>.*))?$" {
		proxy_pass http://127.0.0.1:$tty_port/$tty_path$is_args$args;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 86400;
		proxy_buffering off;
	}

	location ^~ /console/ {
		proxy_pass http://127.0.0.1:7681/console/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 86400;
		proxy_buffering off;
	}

	access_log /var/log/nginx/os-alt-lab-ssl.access.log;
	error_log /var/log/nginx/os-alt-lab-ssl.error.log;
}
