# HTTP: имя хоста для портала и заход по IP
server {
	listen 80;
	listen [::]:80;
	server_name practice.croc.ru 172.26.76.216 _;

	root /var/www/os-alt-lab/public;
	index index.php;
	charset utf-8;

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt  { access_log off; log_not_found off; }

	location ~ \.php$ {
		fastcgi_pass unix:/var/run/php8.2-fpm/php8.2-fpm.sock;
		fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
		include fastcgi_params;
		fastcgi_hide_header X-Powered-By;
		fastcgi_param HTTPS $https if_not_empty;
	}

	location ^~ /console/ {
		proxy_pass http://127.0.0.1:7681/console/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 86400;
		proxy_buffering off;
	}

	access_log /var/log/nginx/os-alt-lab.access.log;
	error_log /var/log/nginx/os-alt-lab.error.log;
}

# HTTPS: для OIDC redirect_uri https://practice.croc.ru/oidc/callback (самоподписанный до боевого сертификата)
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name practice.croc.ru;

	ssl_certificate /etc/nginx/ssl-practice/practice.crt;
	ssl_certificate_key /etc/nginx/ssl-practice/practice.key;
	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL:10m;
	ssl_protocols TLSv1.2 TLSv1.3;

	root /var/www/os-alt-lab/public;
	index index.php;
	charset utf-8;

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt  { access_log off; log_not_found off; }

	location ~ \.php$ {
		fastcgi_pass unix:/var/run/php8.2-fpm/php8.2-fpm.sock;
		fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
		include fastcgi_params;
		fastcgi_hide_header X-Powered-By;
		fastcgi_param HTTPS on;
	}

	location ^~ /console/ {
		proxy_pass http://127.0.0.1:7681/console/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 86400;
		proxy_buffering off;
	}

	access_log /var/log/nginx/os-alt-lab-ssl.access.log;
	error_log /var/log/nginx/os-alt-lab-ssl.error.log;
}
